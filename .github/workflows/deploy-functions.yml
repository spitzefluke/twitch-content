# Lädt die Edge Functions nach Supabase hoch – ohne Node.js oder CLI auf dem eigenen Rechner.
# Läuft automatisch, sobald sich auf main etwas unter supabase/functions ändert,
# und von Hand unter Actions → "Edge Functions deployen" → "Run workflow".
#
# Einmal nötig: In GitHub unter Settings → Secrets and variables → Actions das
# Repository-Secret SUPABASE_ACCESS_TOKEN anlegen (Token aus supabase.com/dashboard/account/tokens).
name: Edge Functions deployen

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-functions.yml'
  workflow_dispatch:

concurrency:
  group: deploy-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      # Steht auch in js/config.js (SUPABASE_URL) und ist nicht geheim.
      PROJECT_REF: ssibsphuttjlphijilsc
    steps:
      - name: Token prüfen
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Secret SUPABASE_ACCESS_TOKEN fehlt. Anlegen unter Settings → Secrets and variables → Actions (Token aus supabase.com/dashboard/account/tokens)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      # --no-verify-jwt: Twitch schickt beim Zurückleiten und beim Webhook keinen Supabase-Login mit.
      - name: Deployen
        run: supabase functions deploy --use-api --no-verify-jwt --project-ref "$PROJECT_REF"
