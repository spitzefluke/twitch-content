<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StreamHelp</title>
  <link rel="stylesheet" href="panel.css">
</head>
<body>
  <!-- Twitch-Panel unter dem Stream (Twitch-Erweiterung, Typ „Panel“). Anleitung: README → „Twitch-Panel“ -->
  <main class="panel" id="panel" aria-live="polite">
    <header class="head">
      <span class="who"><span class="avatar" id="avatar" aria-hidden="true"></span><b class="channel" id="channel"></b></span>
      <span class="brand" title="StreamHelp"><span class="logo" aria-hidden="true">▶</span>Stream<b>Help</b></span>
    </header>
    <div id="content">
      <p class="muted center">Lädt …</p>
    </div>
  </main>
  <script src="https://extension-files.twitch.tv/helper/v1/twitch-ext.min.js"></script>
  <script src="panel-i18n.js"></script>
  <script src="panel.js"></script>
</body>
</html>
