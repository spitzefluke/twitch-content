# Hält die Versionsnummern für JS und CSS aktuell (tools/stamp-versions.mjs).
# Ohne sie mischen Browser nach einem Update alte und neue Dateien aus dem Cache
# („does not provide an export named …“). Läuft bei jedem Push auf main; sind die
# Nummern veraltet (z. B. nach einer Änderung direkt auf GitHub), committet die
# Action sie nach.
name: Versionsnummern aktualisieren

on:
  push:
    branches: [main]
    paths:
      - 'js/**'
      - 'css/**'
      - '*.html'
      - 'tools/stamp-versions.mjs'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stamp-versions
  cancel-in-progress: false

jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Versionsnummern setzen
        run: node tools/stamp-versions.mjs
      - name: Committen, falls nötig
        run: |
          if git diff --quiet; then
            echo "Alles aktuell."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Versionsnummern für JS und CSS aktualisiert"
          git push
