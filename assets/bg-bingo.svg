    <g transform="translate(0 152)"><rect x="0" y="0" width="68" height="68" rx="10" fill="url(#uncommon)"/><rect x="76" y="0" width="68" height="68" rx="10" fill="url(#rare)"/><rect x="152" y="0" width="68" height="68" rx="10" fill="#ffb81c"/><rect x="228" y="0" width="68" height="68" rx="10" fill="url(#epic)"/><rect x="304" y="0" width="68" height="68" rx="10" fill="url(#common)"/></g>
