<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" preserveAspectRatio="xMidYMid slice">
<defs>
<linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a3fa8"/><stop offset=".55" stop-color="#0f2266"/><stop offset="1" stop-color="#070d2b"/></linearGradient>
<radialGradient id="glow" cx=".5" cy=".45" r=".5"><stop offset="0" stop-color="#5ab8ff" stop-opacity=".55"/><stop offset="1" stop-color="#5ab8ff" stop-opacity="0"/></radialGradient>
<linearGradient id="common" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d96a8"/><stop offset="1" stop-color="#4b5263"/></linearGradient>
<linearGradient id="uncommon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6bd34a"/><stop offset="1" stop-color="#256d1c"/></linearGradient>
<linearGradient id="rare" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4fc3ff"/><stop offset="1" stop-color="#1557b0"/></linearGradient>
<linearGradient id="epic" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#c26bff"/><stop offset="1" stop-color="#5b1ea8"/></linearGradient>
<linearGradient id="legendary" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffc24a"/><stop offset="1" stop-color="#c26410"/></linearGradient>
<filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
<filter id="shadow"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".55"/></filter>
</defs>
<rect width="800" height="500" fill="url(#sky)"/>
<circle cx="420" cy="220" r="300" fill="url(#glow)"/>
<g filter="url(#blur)" opacity=".5"><ellipse cx="120" cy="80" rx="170" ry="40" fill="#8fd0ff"/><ellipse cx="700" cy="120" rx="160" ry="36" fill="#8fd0ff"/></g>
