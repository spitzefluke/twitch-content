# Die Functions prüfen den Login selbst (bzw. die Twitch-Signatur),
# daher ist die automatische JWT-Prüfung von Supabase ausgeschaltet.
[functions.twitch-oauth]
verify_jwt = false

[functions.twitch-eventsub]
verify_jwt = false

[functions.spin]
verify_jwt = false

[functions.admin]
verify_jwt = false

[functions.bingo-bet]
verify_jwt = false

[functions.youtube-chat]
verify_jwt = false

[functions.stream-tools]
verify_jwt = false

# Twitch-Panel: prüft den Ausweis der Twitch-Erweiterung (Secret EXTENSION_SECRET) selbst
[functions.twitch-ext]
verify_jwt = false

# YouTube verbinden: Google leitet ohne Supabase-Login zurück
[functions.youtube]
verify_jwt = false

# Trinkgeld: Ko-fi schickt den Webhook ohne Supabase-Login (geprüft wird der Ko-fi-Token des Kanals)
[functions.tips]
verify_jwt = false

# Sponsoring-Börse: Firmen haben kein Konto (Verwaltungs-Link mit geheimem Schlüssel, Spam-Schutz in der Function)
[functions.sponsoring]
verify_jwt = false
