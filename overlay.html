<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OBS-Overlay · Content-Stellwerk</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/overlay.css?v=ce9c678542">
  <link rel="stylesheet" href="css/prank-fx.css?v=c051194a73">
  <link rel="stylesheet" href="css/bingo.css?v=11d2e5d62d">
  <link rel="stylesheet" href="css/pet.css?v=a6b2236f87">
  <link rel="stylesheet" href="css/shop.css?v=19893e12d6">
  <link rel="stylesheet" href="css/challenge.css?v=4c0dae8d37">
  <!-- versions:start (node tools/stamp-versions.mjs) -->
  <script type="importmap">{
    "imports": {
      "./js/admin.js": "./js/admin.js?v=188f6a9537",
      "./js/alerts.js": "./js/alerts.js?v=fdc44d61a1",
      "./js/api.js": "./js/api.js?v=f4df2ed493",
      "./js/app.js": "./js/app.js?v=cd7e038d80",
      "./js/bingo.js": "./js/bingo.js?v=eb0fb757e8",
      "./js/challenge.js": "./js/challenge.js?v=0825bf598f",
      "./js/config.js": "./js/config.js?v=4c6e85333d",
      "./js/defaults.js": "./js/defaults.js?v=e7f5e33395",
      "./js/intro-engine.js": "./js/intro-engine.js?v=2f3a626469",
      "./js/intro-scene.js": "./js/intro-scene.js?v=4308a643f9",
      "./js/intro.js": "./js/intro.js?v=b67e9663cf",
      "./js/obs-ws.js": "./js/obs-ws.js?v=dde286a8f3",
      "./js/overlay.js": "./js/overlay.js?v=9a9c89b3f3",
      "./js/pet.js": "./js/pet.js?v=2dbd87aac3",
      "./js/prank-fx.js": "./js/prank-fx.js?v=8a69fa372f",
      "./js/questions.js": "./js/questions.js?v=794f42e00a",
      "./js/rexi-sfx.js": "./js/rexi-sfx.js?v=66d3439a86",
      "./js/shop.js": "./js/shop.js?v=fcc50151a8",
      "./js/social-icons.js": "./js/social-icons.js?v=54cb7e84b8",
      "./js/ticker.js": "./js/ticker.js?v=5e954fd7b9",
      "./js/twitch-chat.js": "./js/twitch-chat.js?v=f335e15788",
      "./js/weather.js": "./js/weather.js?v=b1e3736ff5",
      "./js/wheel.js": "./js/wheel.js?v=30a4f67816"
    }
  }</script>
  <script type="module">import './js/overlay.js';</script>
  <!-- versions:end -->
</head>
<!-- Als Browserquelle in OBS einbinden (1920 × 1080). Der Hintergrund ist
     durchsichtig, sichtbar sind nur die beiden Karten. Optionen stehen in js/overlay.js,
     die Adresse baut der OBS-Dialog im Dashboard. -->
<body>

  <!-- Ärgere den Dave: Würfe landen auf Daves Kamera (Bereich per ?cam=) -->
  <div class="ov-pranks" id="ov-pranks" aria-hidden="true">
    <div class="ov-prank-feed" id="ov-prank-feed"></div>
  </div>

  <!-- Glücksrad: erscheint nur, wenn gedreht wird -->
  <section class="ov-card ov-spin" id="ov-spin" aria-live="polite">
    <header class="ov-head">
      <span class="ov-dot" aria-hidden="true"></span>
      <span id="ov-wlabel">Glücksrad</span>
      <span class="ov-sep" aria-hidden="true">·</span>
      <span class="ov-who" id="ov-who"></span>
    </header>
    <div class="ov-spin-body">
      <div class="ov-wheel">
        <span class="ov-pointer" id="ov-pointer" aria-hidden="true"></span>
        <canvas id="ov-canvas" aria-hidden="true"></canvas>
        <span class="ov-hub" aria-hidden="true"><img src="assets/favicon.svg" alt=""></span>
      </div>
      <div class="ov-text">
        <p class="ov-variant" id="ov-variant"></p>
        <p class="ov-status" id="ov-status">Das Rad dreht sich …</p>
        <p class="ov-result" id="ov-result"></p>
        <p class="ov-bonus" id="ov-bonus" hidden></p>
        <p class="ov-detail" id="ov-detail"></p>
      </div>
    </div>
  </section>

  <!-- Nächste Abfahrt: wechselt durch die kommenden Content-Ideen -->
  <section class="ov-card ov-next" id="ov-next" hidden>
    <header class="ov-head">
      <span class="ov-dot" aria-hidden="true"></span>
      <span id="ov-nlabel">Nächste Abfahrt</span>
      <span class="ov-sep" aria-hidden="true">·</span>
      <span id="ov-next-date"></span>
    </header>
    <div class="ov-next-body" id="ov-next-body">
      <p class="ov-next-title" id="ov-next-title"></p>
      <div class="ov-countdown" id="ov-countdown">
        <span><b></b><i>Tage</i></span>
        <span><b></b><i>Std</i></span>
        <span><b></b><i>Min</i></span>
        <span><b></b><i>Sek</i></span>
      </div>
    </div>
  </section>

  <!-- Fortnite-Bingo: die aktuelle Karte mit den abgehakten Items -->
  <section class="ov-card ov-bingo" id="ov-bingo" hidden>
    <header class="ov-head">
      <span class="ov-dot" aria-hidden="true"></span>
      <span id="ov-blabel">Fortnite-Bingo</span>
      <span class="ov-sep" aria-hidden="true">·</span>
      <span class="ov-who" id="ov-bingo-progress"></span>
    </header>
    <div class="ov-bingo-body">
      <p class="ov-bingo-bet" id="ov-bingo-bet" hidden></p>
      <div class="bingo-grid" id="ov-bingo-grid"></div>
      <div class="ov-bingo-win" id="ov-bingo-win" aria-hidden="true">Bingo!</div>
    </div>
  </section>

  <!-- Unangenehme Fragen: die Frage, die Dave gerade beantworten muss -->
  <section class="ov-card ov-quest" id="ov-quest" hidden aria-live="polite">
    <header class="ov-head">
      <span class="ov-dot" aria-hidden="true"></span>
      <span>Unangenehme Frage</span>
      <span class="ov-sep" aria-hidden="true">·</span>
      <span class="qcard-author"></span>
    </header>
    <div class="ov-quest-body">
      <p class="qcard-text"></p>
      <p class="qcard-result" hidden></p>
    </div>
  </section>

  <!-- Kisten-Shop: Daves Runde (Goldbarren, gekaufte Items, gefunden), im Koop-Duell das Tauziehen -->
  <section class="ov-card ov-shop" id="ov-shop" hidden aria-live="polite">
    <header class="ov-head">
      <span class="ov-dot" aria-hidden="true"></span>
      <span>Kisten-Shop</span>
      <span class="ov-sep" aria-hidden="true">·</span>
      <span class="ov-who" id="ov-shop-status"></span>
    </header>
    <div class="ov-shop-body">
      <div class="ov-shop-top">
        <span class="ov-shop-coins" id="ov-shop-coins"></span>
        <span class="ov-shop-score" id="ov-shop-score"></span>
      </div>
      <div class="tug ov-shop-tug" id="ov-shop-tug" hidden></div>
      <ul class="loadout ov-shop-list" id="ov-shop-list"></ul>
      <ol class="shop-board ov-shop-board" id="ov-shop-board" hidden></ol>
    </div>
  </section>

  <!-- Win-Challenge: aktuelle Stufe, Siege, Leben, Fortschritt -->
  <section class="ov-card ov-challenge" id="ov-challenge" hidden aria-live="polite">
    <header class="ov-head">
      <span class="ov-dot" aria-hidden="true"></span>
      <span id="ov-ch-title">Win-Challenge</span>
      <span class="ov-sep" aria-hidden="true">·</span>
      <span class="ov-who" id="ov-ch-step"></span>
    </header>
    <div class="ov-ch-body">
      <div class="ov-ch-stage">
        <span class="ov-ch-icon" id="ov-ch-icon" aria-hidden="true"></span>
        <span class="ov-ch-name"><b id="ov-ch-name"></b><small id="ov-ch-vs"></small></span>
      </div>
      <div class="ov-ch-row">
        <span class="ov-ch-pips" id="ov-ch-pips"></span>
        <span class="ch-hearts ov-ch-hearts" id="ov-ch-hearts"></span>
      </div>
      <div class="ov-ch-track" id="ov-ch-track" aria-hidden="true"></div>
    </div>
  </section>
  <!-- Große Effekte der Win-Challenge (Stufe geschafft, Challenge geschafft/gescheitert) -->
  <div class="ov-ch-fx" id="ov-ch-fx"></div>

  <!-- Alerts: springt nur bei neuen Followern, Abos, Resubs, verschenkten Abos und Bits auf -->
  <section class="ov-card ov-alert" id="ov-alert" aria-live="polite">
    <header class="ov-head">
      <span class="ov-dot" aria-hidden="true"></span>
      <span>Alert</span>
    </header>
    <div class="ov-al-show">
      <span class="ov-al-icon" id="ov-al-icon"></span>
      <span class="ov-al-title" id="ov-al-title"></span>
      <b class="ov-al-name" id="ov-al-name"></b>
      <span class="ov-al-sub" id="ov-al-sub-text"></span>
    </div>
    <div class="ov-al-fx" id="ov-al-fx" aria-hidden="true"></div>
  </section>

  <!-- Letzter Follower, letztes Abo, letzte Bits: eigene, dauerhaft sichtbare Karte -->
  <section class="ov-card ov-recent" id="ov-recent">
    <header class="ov-head">
      <span class="ov-dot" aria-hidden="true"></span>
      <span>Zuletzt</span>
    </header>
    <div class="ov-rc-body">
      <p class="ov-rc-row" id="ov-rc-follow-row"><span>💜 Letzter Follower</span><b id="ov-al-follow">–</b></p>
      <p class="ov-rc-row" id="ov-rc-sub-row"><span>⭐ Letztes Abo</span><b id="ov-al-sub">–</b></p>
      <p class="ov-rc-row" id="ov-rc-bits-row"><span>💎 Letzte Bits</span><b id="ov-al-bits">–</b></p>
    </div>
  </section>

  <!-- Twitch-Chat: liest Daves Chat anonym mit (js/twitch-chat.js) -->
  <section class="ov-card ov-chat" id="ov-chat" aria-label="Twitch-Chat">
    <header class="ov-head">
      <span class="ov-dot" aria-hidden="true"></span>
      <span>Chat</span>
    </header>
    <div class="chat-list" id="ov-chat-list" aria-live="off"></div>
  </section>

  <!-- Laufband: andere Seiten und Socials, immer an (verschiebbar im OBS-Dialog) -->
  <section class="ov-card ov-ticker" id="ov-ticker" aria-label="Laufband">
    <span class="ticker-label">Mehr von Dave</span>
    <div class="ticker-view"><div class="ticker-track" id="ov-ticker-track"></div></div>
  </section>

  <!-- Daves Dino läuft unten durchs Bild -->
  <div class="ov-pet" id="ov-pet" aria-hidden="true"></div>

</body>
</html>
