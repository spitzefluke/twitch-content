<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><style>
.r{animation:r .18s linear infinite alternate}.u{animation:u 2s ease-in-out infinite}.f{transform-origin:100px 150px;animation:f .15s linear infinite alternate}
.l{animation:l .6s linear infinite}.l2{animation-delay:.2s}.l3{animation-delay:.4s}
@keyframes r{to{transform:translate(1.5px,-1px)}}@keyframes u{50%{transform:translateY(-10px)}}@keyframes f{to{transform:scaleY(1.3)}}
@keyframes l{0%{transform:translateY(-40px);opacity:0}30%{opacity:.9}100%{transform:translateY(60px);opacity:0}}
</style>
